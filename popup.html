<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Endpoint Picker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <path fill="#ff5a36" d="M2 2h12v3H5v9H2V2zm16 0h12v12h-3V5h-9V2zM2 18h3v9h9v3H2V18zm25 0h3v12H18v-3h9v-9zM13 13h6v6h-6z"/>
        </svg>
        <div>
          <h1>Endpoint Picker</h1>
          <p class="lede">Click any text. See the API field behind it.</p>
        </div>
      </div>
    </header>
    <main>
      <p id="reason" class="reason" hidden></p>
      <button id="toggle" class="primary" type="button">Start inspecting</button>
      <div class="meta">
        <span id="status">Capturing this tab</span>
        <span><strong id="count">0</strong> buffered</span>
      </div>
      <button id="clear" class="quiet" type="button">Clear buffer</button>
      <p class="note"><kbd id="shortcut">…</kbd> inspects. Esc leaves the mode.</p>
      <p class="note">Responses stay in this tab. <a id="privacy" href="privacy.html">Privacy</a></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
